name: Kunlik vazifalar

on:
  schedule:
    - cron: '0 15 * * *'   # har kuni 15:00 UTC = 20:00 Toshkent
  workflow_dispatch:        # "Run workflow" tugmasi — hozir yuborish

jobs:
  yuborish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vazifalarni yuborish
        run: python send.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
